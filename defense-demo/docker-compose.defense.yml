services:
  defense-redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"

  fraud-engine:
    build: .
    working_dir: /app/fraud-engine
    command: uvicorn main:app --host 0.0.0.0 --port 8094
    environment:
      - AI_LAYER_ENABLED=true
    ports:
      - "127.0.0.1:8094:8094"

  queue-service:
    build: .
    working_dir: /app/queue-service
    command: uvicorn main:app --host 0.0.0.0 --port 8091
    environment:
      - REDIS_URL=redis://defense-redis:6379/0
    depends_on:
      - defense-redis
    ports:
      - "127.0.0.1:8091:8091"

  seat-service:
    build: .
    working_dir: /app/seat-service
    command: uvicorn main:app --host 0.0.0.0 --port 8092
    environment:
      - REDIS_URL=redis://defense-redis:6379/0
      - FRAUD_ENGINE_URL=http://fraud-engine:8094
    depends_on:
      - defense-redis
      - fraud-engine
    ports:
      - "127.0.0.1:8092:8092"

  payment-service:
    build: .
    working_dir: /app/payment-service
    command: uvicorn main:app --host 0.0.0.0 --port 8093
    environment:
      - REDIS_URL=redis://defense-redis:6379/0
      - FRAUD_ENGINE_URL=http://fraud-engine:8094
      - THREE_DS_OTP=123456
    depends_on:
      - defense-redis
      - fraud-engine
    ports:
      - "127.0.0.1:8093:8093"

  gateway:
    build: .
    working_dir: /app/gateway
    command: uvicorn main:app --host 0.0.0.0 --port 8090
    environment:
      - REDIS_URL=redis://defense-redis:6379/0
      - QUEUE_SERVICE_URL=http://queue-service:8091
      - SEAT_SERVICE_URL=http://seat-service:8092
      - PAYMENT_SERVICE_URL=http://payment-service:8093
    depends_on:
      - defense-redis
      - queue-service
      - seat-service
      - payment-service
      - fraud-engine
    ports:
      - "127.0.0.1:8090:8090"

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - gateway
  grafana:
    image: grafana/grafana:13.1.5
    profiles: ["observability"]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  bot-loadgen:
    profiles: ["loadgen"]
    build:
      context: .
      dockerfile: bot-loadgen/Dockerfile
    environment:
      - DEFENSE_BASE_URL=http://gateway:8090
      - SCENARIO_PACK=${SCENARIO_PACK:-small}
      - LOADGEN_COUNT=${LOADGEN_COUNT:-0}
      - LOADGEN_SCENARIOS=${LOADGEN_SCENARIOS:-simple_http,no_sensor,browser_like,stealth_browser,full_behavioral,multi_account,human_browser}
      - REPORT_DIR=/reports
    volumes:
      - ./reports:/reports
    depends_on:
      - gateway

  lab-tests:
    profiles: ["test"]
    build: .
    working_dir: /app
    command: python -m unittest discover -s tests -v
    environment:
      - REDIS_URL=redis://defense-redis:6379/15
      - TEST_REDIS_URL=redis://defense-redis:6379/15
    depends_on:
      - defense-redis

  lab-smoke:
    profiles: ["test"]
    build: .
    working_dir: /app
    command: python tests/smoke_profiles.py
    environment:
      - GATEWAY_URL=http://gateway:8090
    depends_on:
      - gateway
