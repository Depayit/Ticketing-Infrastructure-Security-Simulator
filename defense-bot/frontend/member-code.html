<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Defense Live — ยืนยันรหัสสมาชิก</title>
  <link rel="stylesheet" href="/static/ticket.css" />
  <link rel="stylesheet" href="/static/site.css" />
  <script src="/static/telemetry.js"></script>
  <script src="/static/funnel-guard.js"></script>
  <script src="/static/ticket-ui.js"></script>
</head>
<body class="storefront-page member-page">
  <div class="utility-bar"><span>DEFENSE LIVE / LIVE EVENTS</span><span>เว็บไซต์จำลองสำหรับการทดสอบระบบ</span></div>
  <header class="Ticket-header">
    <a class="ticket-logo" href="/" aria-label="Defense Live หน้าแรก"><div class="ticket-logo-main"><span class="ticket-logo-badge">D</span><span>DEFENSE LIVE</span></div><span class="ticket-logo-sub">TICKETING SIMULATOR</span></a>
    <nav class="header-nav" aria-label="เมนูหลัก"><span class="nav-current">คอนเสิร์ต</span><span>วิธีซื้อบัตร</span><span class="header-help">ศูนย์ช่วยเหลือ</span></nav>
    <span class="header-sim-label">SIMULATION</span>
  </header>

  <!-- Main Body Content -->
  <main class="main-container">
    <div class="split-card">
      <!-- The same venue atmosphere appears across the purchase flow. -->
      <div class="member-photo">
        <span class="hero-eyebrow">MEMBER ACCESS</span>
        <h2>อีกก้าวเดียวก่อนเลือกที่นั่ง</h2>
        <p>ตรวจสอบสิทธิ์สมาชิกสำหรับรอบการแสดงนี้</p>
      </div>

      <!-- Right: Code Entry Form -->
      <div class="form-section">
        <h2 class="form-title">กรุณาใส่โค้ด</h2>
        <form id="code-form">
          <div class="input-wrapper">
            <input 
              type="text" 
              id="member-code-input" 
              class="code-input" 
              placeholder="กรุณาใส่โค้ด" 
              required 
              autocomplete="off" 
              autofocus
            />
          </div>
          <button type="submit" class="submit-btn">ตกลง</button>
        </form>
        <div id="error-message" class="error-msg"></div>
      </div>
    </div>
  </main>

  <footer class="Ticket-footer"></footer>

  <script>
    (function () {
      "use strict";
      TTMUI.renderDefenseFooter(false);

      // 1. Verify queue token (funnel check)
      const token = TTMFunnel.requireQueueToken();
      if (!token) {
        // requireQueueToken already alerts and redirects, but in case
        return;
      }

      const form = document.getElementById("code-form");
      const input = document.getElementById("member-code-input");
      const errorDiv = document.getElementById("error-message");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        const code = input.value.trim();

        if (!code) {
          showError("กรุณากรอกรหัสสมาชิก");
          return;
        }

        if (code.length < 4) {
          showError("รหัสสมาชิกต้องมีความยาวอย่างน้อย 4 ตัวอักษร");
          return;
        }

        // Save member code to localStorage
        localStorage.setItem("defense_member_code", code);
        
        // Track the verification step in telemetry
        if (window.DefenseTelemetry && typeof DefenseTelemetry.track === "function") {
          DefenseTelemetry.track("funnel", { step: "member_code_verified" });
        }

        // Redirect to seat map page
        location.href = "/seats";
      });

      function showError(msg) {
        errorDiv.textContent = msg;
        errorDiv.style.display = "block";
        input.focus();
      }
    })();
  </script>
</body>
</html>
